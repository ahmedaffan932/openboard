apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'com.google.gms.google-services'

android {
    namespace 'org.dslul.openboard.inputmethod.latin'
    compileSdk 34

    defaultConfig {
        applicationId "com.guru.translate.translator.pro.translation.keyboard.translator"
        minSdk 27
        targetSdk 34
        versionCode 61
        versionName "4.18"
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            jniDebuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }

        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    kotlin {
        jvmToolchain(17)
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    // 🔴 REQUIRED for 16 KB page size support
    ndkVersion "26.3.11579264"

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    androidResources {
        noCompress 'dict'
    }

    buildFeatures {
        viewBinding true
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {

    // Core
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.viewpager2:viewpager2:1.1.0"

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // 🔴 ML Kit (16 KB SAFE)
    implementation "com.google.mlkit:translate:17.0.2"
    implementation "com.google.mlkit:language-id:17.0.4"
    implementation "com.google.mlkit:text-recognition:16.0.0-beta1"
    implementation "com.google.mlkit:text-recognition-chinese:16.0.0-beta1"
    implementation "com.google.mlkit:text-recognition-japanese:16.0.0-beta1"
    implementation "com.google.mlkit:text-recognition-korean:16.0.0-beta1"

    // Firebase (BoM managed)
    implementation platform("com.google.firebase:firebase-bom:33.3.0")
    implementation "com.google.firebase:firebase-analytics-ktx"
    implementation "com.google.firebase:firebase-messaging"
    implementation "com.google.firebase:firebase-config-ktx"
    implementation "com.google.firebase:firebase-crashlytics-ktx"
    implementation "com.google.firebase:firebase-storage"

    // Ads & Billing
    implementation "com.google.android.gms:play-services-ads:23.2.0"
    implementation "com.android.billingclient:billing-ktx:7.1.1"
    implementation "com.google.android.play:review-ktx:2.0.2"

    // CameraX
    implementation "androidx.camera:camera-camera2:1.3.4"
    implementation "androidx.camera:camera-lifecycle:1.3.4"
    implementation "androidx.camera:camera-view:1.3.4"

    // UI & Utils
    implementation "com.airbnb.android:lottie:6.4.0"
    implementation "com.squareup.picasso:picasso:2.8"
    implementation "com.google.code.gson:gson:2.11.0"
    implementation "org.jsoup:jsoup:1.17.2"

    // Image Cropper
    implementation "com.vanniktech:android-image-cropper:4.6.0"

    // UMP
    implementation "com.google.android.ump:user-messaging-platform:3.0.0"

    // Guava
    implementation "com.google.guava:guava:33.2.1-android"

    // Local modules
    implementation project(":country_data")
    implementation project(":keyboard-listener")
}
