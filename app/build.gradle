apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'com.google.gms.google-services'

android {
    namespace 'org.dslul.openboard.inputmethod.latin'
    compileSdk 36

    defaultConfig {
        applicationId "com.translator.keyboard.translate.all.langugaes"
        minSdk 27
        targetSdk 36
        versionCode 13
        versionName "2.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            jniDebuggable false
            buildConfigField "boolean", "ADS_ENABLED", "false"
            manifestPlaceholders = [
                    adMobApplicationId: "ca-app-pub-6065249128764297~4869798198"
            ]
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }

        debug {
            minifyEnabled false
            debuggable true
            buildConfigField "boolean", "ADS_ENABLED", "true"
            manifestPlaceholders = [
                    adMobApplicationId: "ca-app-pub-3940256099942544~3347511713"
            ]
        }
    }

    compileOptions {
        // Match Android Studio JBR (21). AGP resolves javaCompiler via toolchain
        // from this version — VERSION_17 fails when only JDK 21 is installed.
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    // 🔴 REQUIRED for 16 KB page size support
    ndkVersion "26.3.11579264"

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    androidResources {
        noCompress 'dict'
    }

    buildFeatures {
        viewBinding true
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    lint {
        abortOnError false
        // Known-benign AOSP keyboard patterns, not real defects:
        //   ResourceCycle          - KeyboardIcons/KeyboardTheme use the ".Parent" naming
        //                            trick; the explicit parent= attribute wins at runtime,
        //                            so the reported cycle never exists.
        //   MissingDefaultResource - sw600dp layouts and h###dp setup dimens are intentionally
        //                            config-specific and only queried in matching configurations.
        // lintVitalRelease treats these as fatal, so disable them outright.
        disable 'ResourceCycle', 'MissingDefaultResource'
    }
}

dependencies {

    // Core
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-ktx:1.9.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.viewpager2:viewpager2:1.1.0"

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.10"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // 🔴 ML Kit (16 KB SAFE)
    implementation "com.google.mlkit:translate:17.0.3"
    implementation "com.google.mlkit:language-id:17.0.6"
    implementation "com.google.mlkit:text-recognition:16.0.1"
    implementation "com.google.mlkit:text-recognition-chinese:16.0.1"
    implementation "com.google.mlkit:text-recognition-japanese:16.0.1"
    implementation "com.google.mlkit:text-recognition-korean:16.0.1"

    // Firebase (BoM managed)
    implementation platform("com.google.firebase:firebase-bom:33.3.0")
    implementation "com.google.firebase:firebase-analytics-ktx"
    implementation "com.google.firebase:firebase-messaging"
    implementation "com.google.firebase:firebase-config-ktx"
    implementation "com.google.firebase:firebase-crashlytics-ktx"
    implementation "com.google.firebase:firebase-storage"

    // Ads & Billing
    implementation "com.google.android.gms:play-services-ads:24.7.0"
    implementation "com.google.ads.mediation:pangle:8.0.0.4.0"
    implementation "com.google.ads.mediation:mintegral:17.1.51.0"
    implementation "com.google.ads.mediation:vungle:7.7.4.0"
    implementation "com.google.ads.mediation:facebook:6.20.0.2"
    // Meta Audience Network SDK (served via AdMob mediation above). Pulled in transitively by the
    // adapter; declared explicitly, version-matched, so com.facebook.ads.AdSettings is reliably on
    // the compile classpath for MetaAdsConsent.
    implementation "com.facebook.android:audience-network-sdk:6.20.0"
    implementation "com.android.billingclient:billing-ktx:8.3.0"
    implementation "com.google.android.play:review-ktx:2.0.2"

    // CameraX
    implementation "androidx.camera:camera-camera2:1.4.2"
    implementation "androidx.camera:camera-lifecycle:1.4.2"
    implementation "androidx.camera:camera-view:1.4.2"

    // UI & Utils
    implementation "androidx.lifecycle:lifecycle-process:2.8.4"
    implementation "com.intuit.sdp:sdp-android:1.1.1"
    implementation "com.facebook.shimmer:shimmer:0.5.0"
    implementation "com.airbnb.android:lottie:6.4.0"
    implementation "com.squareup.picasso:picasso:2.8"
    implementation "com.google.code.gson:gson:2.11.0"
    implementation "org.jsoup:jsoup:1.17.2"

    // Image Cropper
    implementation "com.vanniktech:android-image-cropper:4.6.0"

    // UMP
    implementation "com.google.android.ump:user-messaging-platform:3.0.0"

    // Guava
    implementation "com.google.guava:guava:33.2.1-android"

    // Local modules
    implementation project(":country_data")
    implementation project(":keyboard-listener")

    // Unit tests (plain JVM: notification slot parsing, rotation, pinned-card identity)
    testImplementation "junit:junit:4.13.2"
}